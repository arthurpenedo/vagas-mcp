[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagas-mcp"
version = "0.2.0"
description = "Servidor MCP que dá ao Claude ferramentas para organizar candidaturas a vagas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["mcp>=2.2,<3", "httpx>=0.27"]

[project.optional-dependencies]
ats = ["ats-match @ git+https://github.com/arthurpenedo/ats-match"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vagas-mcp = "vagas_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
